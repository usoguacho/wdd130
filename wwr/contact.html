<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us and the Wild River Rafting Co.</title>
    <meta name="description"
      content="Contact Wild River Rafting Co. to book your next adventure, ask about our trips, or connect with our expert guides. We are ready to help">
    <meta name="author" content="Sam Tuala">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/wwr-logo.jpg" alt="Whitewater Rafting Logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main class="contact-main">

        <!-- Company Info -->
        <section class="company-info">
            <h1>Wild River Rafting Co.</h1>
            <address>
                <p>123 Rapid Rush Road</p>
                <p>Moab, Utah 84532</p>
                <p>Phone: <a href="tel:+14355550199">(435) 555-0199</a></p>
                <p>Toll-Free: <a href="tel:+18005550199">(800) 555-0199</a></p>
                <p>Email: <a href="mailto:info@wildriverrafting.com">info@wildriverrafting.com</a>
                </p>
            </address>
        </section>

        <!-- Map + Form Side by Side -->
        <section class="contact-grid">

            <!-- Embedded Google Map -->
            <div class="map-container">
                <iframe title="Wild River Rafting Co. Location"
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d24471.557623985!2d-109.5503!3d38.5733!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8747a8a3e2f7f8df%3A0x1234567890abcdef!2sMoab%2C%20UT%2084532!5e0!3m2!1sen!2sus!4v1680000000000"
                  allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade">
                </iframe>
            </div>

            <!-- Contact Form -->
            <div class="form-container">
                <h2>Get in Touch!</h2>
                <form action="#" method="get">

                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" placeholder="Your full name"
                          required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="your@email.com"
                          required>
                    </div>

                    <div class="form-group">
                        <label>Message Purpose</label>
                        <div class="radio-group">
                            <label class="radio-label">
                                <input type="radio" id="purpose-general" name="purpose"
                                  value="general" checked>
                                General Inquiry
                            </label>
                            <label class="radio-label">
                                <input type="radio" id="purpose-reservation" name="purpose"
                                  value="reservation">
                                Reservation Question
                            </label>
                            <label class="radio-label">
                                <input type="radio" id="purpose-website" name="purpose"
                                  value="website">
                                Website Suggestion
                            </label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="5"
                          placeholder="Type your message here..."></textarea>
                    </div>

                    <div class="form-group checkbox-group">
                        <label class="checkbox-label" for="newsletter">
                            <input type="checkbox" id="newsletter" name="newsletter" value="yes">
                            Please subscribe me to the monthly newsletter
                        </label>
                    </div>

                    <button type="submit" class="submit-btn">Get in Touch!</button>

                </form>
            </div>
        </section>

        <!-- Employee Profiles -->
        <section class="team-section">
            <h2>We Are Here to Serve You</h2>
            <div class="team-grid">
                <figure class="employee-card">
                    <img src="images/jake.jpg" alt="River guide Jake Moreno">
                    <figcaption>
                        <strong>Jake Moreno</strong>
                        <span>Head River Guide</span>
                    </figcaption>
                </figure>
                <figure class="employee-card">
                    <img src="images/maria.jpg" alt="Safety officer Maria Chen">
                    <figcaption>
                        <strong>Maria Chen</strong>
                        <span>Safety Officer</span>
                    </figcaption>
                </figure>
                <figure class="employee-card">
                    <img src="images/tyler.jpg" alt="Reservations manager Tyler Brooks">
                    <figcaption>
                        <strong>Tyler Brooks</strong>
                        <span>Reservations Manager</span>
                    </figcaption>
                </figure>
            </div>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 Wild River Rafting Co. | Sam Tuala</p>
        <nav class="socialmedia">
            <a href="https://www.facebook.com" target="_blank">
                <img src="images/facebook-square.svg" alt="Facebook-logo">
            </a>
            <a href="https://www.instagram.com" target="_blank">
                <img src="images/instagram.svg" alt="Instagram-logo">
            </a>
            <a href="https://www.youtube.com" target="_blank">
                <img src="images/youtube-square.svg" alt="YouTube-logo">
            </a>
        </nav>
    </footer>

</body>

</html>
